<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>冰塊融化實驗室 - Fair Test Simulator</title>
  <style>
    :root {
      --primary: #2B6CB0;
      --secondary: #4299E1;
      --accent: #ECC94B;
      --bg: #EBF8FF;
      --card-bg: #FFFFFF;
      --text: #2D3748;
      --correct: #38A169;
      --incorrect: #E53E3E;
    }

    * {
      box-sizing: border-box;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .lab-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 20px;
      border: 3px solid #BEE3F8;
    }

    .header {
      text-align: center;
      border-bottom: 2px dashed #CBD5E0;
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .preset-btns {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }

    .preset-btn {
      background: #EDF2F7;
      border: 2px solid #CBD5E0;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .preset-btn:hover {
      background: #E2E8F0;
      border-color: var(--primary);
    }

    /* 實驗對比區 */
    .lab-stage {
      display: flex;
      justify-content: space-around;
      gap: 15px;
      background: #F7FAFC;
      border-radius: 16px;
      padding: 15px;
      border: 1px solid #E2E8F0;
    }

    .setup-box {
      flex: 1;
      background: white;
      border-radius: 12px;
      padding: 15px;
      border: 2px solid #E2E8F0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 水槽繪製 */
    .beaker {
      width: 140px;
      height: 120px;
      border: 4px solid #A0AEC0;
      border-top: none;
      border-radius: 0 0 30px 30px;
      position: relative;
      background: #EDF2F7;
      margin: 15px 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .water {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(66, 153, 225, 0.5);
      transition: height 0.3s;
    }

    .water.salt {
      background: rgba(49, 130, 206, 0.7);
    }

    /* 冰塊繪製 */
    .ice {
      z-index: 2;
      background: #EBF8FF;
      border: 2px solid #90CDF4;
      box-shadow: 0 0 8px rgba(255,255,255,0.8);
      transition: transform 0.1s linear;
    }

    .ice.ball {
      width: 40px;
      height: 40px;
      border-radius: 50%;
    }

    .ice.cube {
      width: 40px;
      height: 40px;
      border-radius: 6px;
    }

    /* 控制項 */
    .control-group {
      width: 100%;
      margin-top: 10px;
      font-size: 14px;
      text-align: left;
    }

    select {
      width: 100%;
      padding: 6px;
      border-radius: 6px;
      border: 1px solid #CBD5E0;
      margin-top: 4px;
      margin-bottom: 8px;
    }

    /* 診斷儀表板 */
    .dashboard {
      margin-top: 15px;
      padding: 15px;
      background: #EDF2F7;
      border-radius: 12px;
      text-align: center;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 18px;
      color: white;
      margin-bottom: 8px;
    }

    .status-badge.fair { background: var(--correct); }
    .status-badge.unfair { background: var(--incorrect); }

    .diff-list {
      font-size: 14px;
      color: #4A5568;
      margin: 8px 0;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .action-btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 4px 0 #2C5282;
      transition: all 0.1s;
    }

    .action-btn.check {
      background: #DD6B20;
      box-shadow: 0 4px 0 #C05621;
    }

    .action-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #2C5282;
    }

    #resultArea {
      display: none; /* 預設隱蔽答案 */
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #CBD5E0;
    }
  </style>
</head>
<body>

<div class="lab-container">
  <div class="header">
    <h2>🧪 互動式模擬實驗室：Fair Test 診斷室</h2>
    <p style="margin:0; font-size:14px; color:#718096;">探究：冰塊在不同條件下的融化速度</p>
  </div>

  <!-- 快捷載入預設案例 -->
  <div class="preset-btns">
    <span style="font-weight:bold; align-self:center; font-size:14px;">快速載入題目案例：</span>
    <button class="preset-btn" onclick="loadExperiment('A')">Experiment A</button>
    <button class="preset-btn" onclick="loadExperiment('B')">Experiment B</button>
    <button class="preset-btn" onclick="loadExperiment('C')">Experiment C</button>
  </div>

  <!-- 實驗對比區 -->
  <div class="lab-stage">
    <!-- Set-up 1 -->
    <div class="setup-box">
      <h3 style="margin:0; color:var(--primary);">Set-up 1</h3>
      <div class="beaker">
        <div class="water" id="water1"></div>
        <div class="ice ball" id="ice1"></div>
      </div>
      <div class="control-group">
        <label><b>1. Water Type:</b></label>
        <select id="waterType1" onchange="onSettingChange()">
          <option value="Fresh water">Fresh water (淡水)</option>
          <option value="Salt water">Salt water (鹹水)</option>
        </select>

        <label><b>2. Water Volume:</b></label>
        <select id="waterVol1" onchange="onSettingChange()">
          <option value="1 L">1 L</option>
          <option value="2 L">2 L</option>
        </select>

        <label><b>3. Ice Shape:</b></label>
        <select id="iceShape1" onchange="onSettingChange()">
          <option value="ice ball">ice ball (冰球)</option>
          <option value="ice cube">ice cube (冰塊)</option>
        </select>
      </div>
    </div>

    <!-- Set-up 2 -->
    <div class="setup-box">
      <h3 style="margin:0; color:var(--primary);">Set-up 2</h3>
      <div class="beaker">
        <div class="water" id="water2"></div>
        <div class="ice ball" id="ice2"></div>
      </div>
      <div class="control-group">
        <label><b>1. Water Type:</b></label>
        <select id="waterType2" onchange="onSettingChange()">
          <option value="Salt water">Salt water (鹹水)</option>
          <option value="Fresh water">Fresh water (淡水)</option>
        </select>

        <label><b>2. Water Volume:</b></label>
        <select id="waterVol2" onchange="onSettingChange()">
          <option value="1 L">1 L</option>
          <option value="2 L">2 L</option>
        </select>

        <label><b>3. Ice Shape:</b></label>
        <select id="iceShape2" onchange="onSettingChange()">
          <option value="ice ball">ice ball (冰球)</option>
          <option value="ice cube">ice cube (冰塊)</option>
        </select>
      </div>
    </div>
  </div>

  <!-- 診斷儀表板 -->
  <div class="dashboard">
    <div class="btn-group">
      <button class="action-btn check" onclick="checkAnswer()">🔍 檢查是否為 Fair Test (Check Answer)</button>
      <button class="action-btn" id="startBtn" onclick="runSimulation()">▶️ 開始模擬融化實驗 (Start Simulation)</button>
    </div>

    <!-- 答案隱藏區 -->
    <div id="resultArea">
      <div style="margin-top:10px;">
        <span class="status-badge" id="statusBadge">Checking...</span>
      </div>
      <div style="font-weight:bold; font-size:16px;">
        Number of difference(s): <span id="diffCount" style="font-size:20px;">0</span>
      </div>
      <div class="diff-list" id="diffDetails"></div>
      <div id="explanationText" style="font-size:13px; color:#4A5568; margin-top:5px;"></div>
    </div>
  </div>
</div>

<script>
  let timerInterval = null;

  function onSettingChange() {
    updateVisuals();
    hideResult();
    resetIceSize();
  }

  function hideResult() {
    document.getElementById('resultArea').style.display = 'none';
  }

  function updateVisuals() {
    let wt1 = document.getElementById('waterType1').value;
    let wv1 = document.getElementById('waterVol1').value;
    let is1 = document.getElementById('iceShape1').value;

    let wt2 = document.getElementById('waterType2').value;
    let wv2 = document.getElementById('waterVol2').value;
    let is2 = document.getElementById('iceShape2').value;

    // 更新 Set-up 1 視覺
    let water1 = document.getElementById('water1');
    water1.style.height = (wv1 === '1 L') ? '40%' : '70%';
    water1.className = 'water ' + (wt1 === 'Salt water' ? 'salt' : '');
    document.getElementById('ice1').className = 'ice ' + (is1 === 'ice ball' ? 'ball' : 'cube');

    // 更新 Set-up 2 視覺
    let water2 = document.getElementById('water2');
    water2.style.height = (wv2 === '1 L') ? '40%' : '70%';
    water2.className = 'water ' + (wt2 === 'Salt water' ? 'salt' : '');
    document.getElementById('ice2').className = 'ice ' + (is2 === 'ice ball' ? 'ball' : 'cube');
  }

  function checkAnswer() {
    let wt1 = document.getElementById('waterType1').value;
    let wv1 = document.getElementById('waterVol1').value;
    let is1 = document.getElementById('iceShape1').value;

    let wt2 = document.getElementById('waterType2').value;
    let wv2 = document.getElementById('waterVol2').value;
    let is2 = document.getElementById('iceShape2').value;

    // 計算差異 (Differences)
    let differences = [];
    let sameVariables = [];

    if (wt1 !== wt2) {
      differences.push({ name: "Water Type", val1: wt1, val2: wt2 });
    } else {
      sameVariables.push("Water Type (" + wt1 + ")");
    }

    if (wv1 !== wv2) {
      differences.push({ name: "Water Volume", val1: wv1, val2: wv2 });
    } else {
      sameVariables.push("Water Volume (" + wv1 + ")");
    }

    if (is1 !== is2) {
      differences.push({ name: "Ice Shape", val1: is1, val2: is2 });
    } else {
      sameVariables.push("Ice Shape (" + is1 + ")");
    }

    let diffCount = differences.length;
    document.getElementById('diffCount').innerText = diffCount;

    let badge = document.getElementById('statusBadge');
    let diffDetails = document.getElementById('diffDetails');
    let expText = document.getElementById('explanationText');

    if (diffCount === 1) {
      // 只要恰好有 1 個變項不同，即為公平測試 (Fair Test)
      let changedVar = differences[0];
      badge.className = "status-badge fair";
      badge.innerText = "This IS a fair test ✅";
      document.getElementById('diffCount').style.color = "var(--correct)";
      
      diffDetails.innerHTML = `
        <b>Variable to be changed:</b> ${changedVar.name} (${changedVar.val1} vs ${changedVar.val2})<br>
        <b>Variables kept constant:</b> ${sameVariables.join(', ')}
      `;
      expText.innerText = `🎯 太棒了！只有【${changedVar.name}】改變，其餘變項保持不變，這是一個標準的 Fair Test！`;
    } else {
      // 0 個或超過 1 個變項不同，皆非公平測試
      badge.className = "status-badge unfair";
      badge.innerText = "This is NOT a fair test ❌";
      document.getElementById('diffCount').style.color = "var(--incorrect)";
      
      if (diffCount === 0) {
        diffDetails.innerHTML = "<b>Difference(s) detected:</b> None (兩邊設定完全相同)";
        expText.innerText = "⚠️ 兩邊完全一樣，沒有改變任何變項，無法進行對比實驗！";
      } else {
        let diffStr = differences.map(d => `${d.name} (${d.val1} vs ${d.val2})`).join(', ');
        diffDetails.innerHTML = `<b>Difference(s) detected (${diffCount}):</b> ${diffStr}`;
        expText.innerText = `⚠️ 有 ${diffCount} 個不相同的變項！一次只能改變 1 個變項，其他條件必須保持不變 (Kept constant)，否則無法得出公平結論。`;
      }
    }

    // 顯示答案區域
    document.getElementById('resultArea').style.display = 'block';
  }

  function loadExperiment(type) {
    if (type === 'A') {
      document.getElementById('waterType1').value = "Fresh water";
      document.getElementById('waterVol1').value = "1 L";
      document.getElementById('iceShape1').value = "ice ball";

      document.getElementById('waterType2').value = "Salt water";
      document.getElementById('waterVol2').value = "2 L";
      document.getElementById('iceShape2').value = "ice ball";
    } else if (type === 'B') {
      document.getElementById('waterType1').value = "Fresh water";
      document.getElementById('waterVol1').value = "1 L";
      document.getElementById('iceShape1').value = "ice ball";

      document.getElementById('waterType2').value = "Salt water";
      document.getElementById('waterVol2').value = "1 L";
      document.getElementById('iceShape2').value = "ice cube";
    } else if (type === 'C') {
      document.getElementById('waterType1').value = "Fresh water";
      document.getElementById('waterVol1').value = "1 L";
      document.getElementById('iceShape1').value = "ice ball";

      document.getElementById('waterType2').value = "Salt water";
      document.getElementById('waterVol2').value = "1 L";
      document.getElementById('iceShape2').value = "ice ball";
    }
    onSettingChange();
  }

  function resetIceSize() {
    clearInterval(timerInterval);
    document.getElementById('ice1').style.transform = "scale(1)";
    document.getElementById('ice2').style.transform = "scale(1)";
    document.getElementById('startBtn').innerText = "▶️ 開始模擬融化實驗 (Start Simulation)";
    document.getElementById('startBtn').disabled = false;
  }

  function runSimulation() {
    let btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.innerText = "⏳ 實驗進行中 (Simulating)...";

    let scale1 = 1.0;
    let scale2 = 1.0;

    let wt1 = document.getElementById('waterType1').value;
    let wv1 = document.getElementById('waterVol1').value;
    let is1 = document.getElementById('iceShape1').value;

    let wt2 = document.getElementById('waterType2').value;
    let wv2 = document.getElementById('waterVol2').value;
    let is2 = document.getElementById('iceShape2').value;

    let rate1 = (wt1 === 'Salt water' ? 0.03 : 0.015) * (wv1 === '2 L' ? 1.3 : 1.0) * (is1 === 'ice cube' ? 1.1 : 1.0);
    let rate2 = (wt2 === 'Salt water' ? 0.03 : 0.015) * (wv2 === '2 L' ? 1.3 : 1.0) * (is2 === 'ice cube' ? 1.1 : 1.0);

    timerInterval = setInterval(() => {
      scale1 = Math.max(0, scale1 - rate1);
      scale2 = Math.max(0, scale2 - rate2);

      document.getElementById('ice1').style.transform = `scale(${scale1})`;
      document.getElementById('ice2').style.transform = `scale(${scale2})`;

      if (scale1 === 0 && scale2 === 0) {
        clearInterval(timerInterval);
        btn.innerText = "🔄 重置實驗 (Reset)";
        btn.disabled = false;
      }
    }, 100);
  }

  // 初始化
  loadExperiment('A');
</script>

</body>
</html>
